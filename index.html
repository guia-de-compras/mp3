<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Upload — Músicas</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1a1e28;
    --panel-border: #262b38;
    --text: #e8e6e1;
    --muted: #8b93a3;
    --amber: #d9a441;
    --amber-dim: #6b5426;
    --danger: #d9634a;
    --ok: #5fae7a;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    margin-bottom: 28px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 18px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 13px;
    text-transform: none;
    color: var(--muted);
    margin: 0 0 14px;
    font-weight: 500;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--text);
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: #0f1218;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 14px;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: none;
    border-color: var(--amber-dim);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .file-drop {
    border: 1px dashed var(--panel-border);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  .file-drop.has-file { border-color: var(--amber-dim); color: var(--text); }
  .file-drop input { display: none; }
  button {
    width: 100%;
    background: var(--amber);
    color: #1a1408;
    border: none;
    padding: 11px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    font-weight: 500;
    margin-top: 8px;
  }
  .status {
    margin-top: 12px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius);
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: rgba(95,174,122,0.12); color: var(--ok); }
  .status.err { background: rgba(217,99,74,0.12); color: var(--danger); }
  .status.pending { background: rgba(139,147,163,0.12); color: var(--muted); }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .name { color: var(--text); word-break: break-word; }
  .history-item .date { color: var(--muted); font-size: 11px; }
  .history-item button {
    width: auto;
    padding: 6px 10px;
    font-size: 12px;
    background: var(--panel-border);
    color: var(--text);
    font-weight: 500;
    flex-shrink: 0;
  }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 8px 0; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: -8px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Upload de músicas</h1>
    <p>Envia direto pro seu repositório do GitHub e gera o link.</p>
  </header>

  <section>
    <h2>Configuração</h2>
    <label for="owner">Usuário / Organização</label>
    <input type="text" id="owner" placeholder="ex: guia-de-compras">
    <div class="row2">
      <div>
        <label for="repo">Repositório</label>
        <input type="text" id="repo" placeholder="ex: mp3">
      </div>
      <div>
        <label for="branch">Branch</label>
        <input type="text" id="branch" placeholder="main" value="main">
      </div>
    </div>
    <label for="folder">Pasta dentro do repositório (opcional)</label>
    <input type="text" id="folder" placeholder="ex: musicas (deixe vazio pra raiz)">
    <label for="token">Personal Access Token</label>
    <input type="password" id="token" placeholder="github_pat_...">
    <p class="hint">Token fine-grained, só com permissão "Contents: Read and write" nesse repositório. Fica salvo apenas neste navegador.</p>
  </section>

  <section>
    <h2>Nova música</h2>
    <label for="songname">Nome da música</label>
    <input type="text" id="songname" placeholder="ex: Reggae Roots">

    <div class="file-drop" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*">
      <span id="dropLabel">Toque para escolher o arquivo (máx. 25MB)</span>
    </div>

    <button id="uploadBtn">Enviar</button>
    <div class="status" id="status"></div>
  </section>

  <section>
    <h2>Músicas enviadas</h2>
    <div id="historyList"></div>
  </section>
</div>

<script>
const MAX_BYTES = 25 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const fields = ["owner", "repo", "branch", "folder", "token"];

// Carrega config salva
fields.forEach(f => {
  const saved = localStorage.getItem("cfg_" + f);
  if (saved !== null) $(f).value = saved;
});
fields.forEach(f => {
  $(f).addEventListener("input", () => localStorage.setItem("cfg_" + f, $(f).value));
});

let selectedFile = null;
$("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > MAX_BYTES) {
    setStatus("err", `Arquivo com ${(file.size/1024/1024).toFixed(1)}MB — passa do limite de 25MB.`);
    $("fileInput").value = "";
    selectedFile = null;
    $("dropZone").classList.remove("has-file");
    $("dropLabel").textContent = "Toque para escolher o arquivo (máx. 25MB)";
    return;
  }
  selectedFile = file;
  $("dropZone").classList.add("has-file");
  $("dropLabel").textContent = `${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`;
});
$("dropZone").addEventListener("click", () => $("fileInput").click());

function setStatus(kind, msg) {
  const el = $("status");
  el.className = "status show " + kind;
  el.textContent = msg;
}

function sanitizeFilename(name) {
  return name
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9._-]+/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_|_$/g, "");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function githubRequest(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

$("uploadBtn").addEventListener("click", async () => {
  const owner = $("owner").value.trim();
  const repo = $("repo").value.trim();
  const branch = $("branch").value.trim() || "main";
  const folder = $("folder").value.trim().replace(/^\/|\/$/g, "");
  const token = $("token").value.trim();
  const songname = $("songname").value.trim();

  if (!owner || !repo || !token) {
    setStatus("err", "Preenche usuário, repositório e token na configuração.");
    return;
  }
  if (!songname) {
    setStatus("err", "Dá um nome pra música.");
    return;
  }
  if (!selectedFile) {
    setStatus("err", "Escolhe um arquivo de áudio.");
    return;
  }

  const ext = selectedFile.name.split(".").pop().toLowerCase();
  const baseName = sanitizeFilename(songname) + "." + ext;
  const path = folder ? `${folder}/${baseName}` : baseName;
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  $("uploadBtn").disabled = true;
  setStatus("pending", "Convertendo arquivo...");

  try {
    const base64Content = await fileToBase64(selectedFile);

    setStatus("pending", "Verificando se já existe...");
    // Checa se o arquivo já existe (pra pegar o sha e sobrescrever)
    let sha = null;
    const existing = await githubRequest(apiUrl + `?ref=${branch}`, {
      headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
    });
    if (existing.ok && existing.data.sha) sha = existing.data.sha;

    setStatus("pending", "Enviando pro GitHub...");
    const body = {
      message: `Upload: ${songname}`,
      content: base64Content,
      branch: branch
    };
    if (sha) body.sha = sha;

    const result = await githubRequest(apiUrl, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (!result.ok) {
      const msg = result.data.message || "Erro desconhecido";
      setStatus("err", `Falhou (${result.status}): ${msg}`);
      return;
    }

    const rawLink = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
    setStatus("ok", "Enviado com sucesso!");
    addToHistory(songname, rawLink);

    // Limpa o form
    $("songname").value = "";
    $("fileInput").value = "";
    selectedFile = null;
    $("dropZone").classList.remove("has-file");
    $("dropLabel").textContent = "Toque para escolher o arquivo (máx. 25MB)";

  } catch (err) {
    setStatus("err", "Erro de conexão: " + err.message);
  } finally {
    $("uploadBtn").disabled = false;
  }
});

function getHistory() {
  try { return JSON.parse(localStorage.getItem("song_history") || "[]"); }
  catch { return []; }
}
function saveHistory(list) {
  localStorage.setItem("song_history", JSON.stringify(list));
}
function addToHistory(name, link) {
  const list = getHistory();
  list.unshift({ name, link, date: new Date().toLocaleString("pt-BR") });
  saveHistory(list);
  renderHistory();
}
function renderHistory() {
  const list = getHistory();
  const container = $("historyList");
  if (list.length === 0) {
    container.innerHTML = '<div class="empty">Nenhuma música enviada ainda.</div>';
    return;
  }
  container.innerHTML = list.map((item, i) => `
    <div class="history-item">
      <div>
        <div class="name">${item.name}</div>
        <div class="date">${item.date}</div>
      </div>
      <button onclick="copyLink(${i})">Copiar link</button>
    </div>
  `).join("");
}
function copyLink(i) {
  const list = getHistory();
  navigator.clipboard.writeText(list[i].link).then(() => {
    setStatus("ok", "Link copiado: " + list[i].link);
  });
}
renderHistory();
</script>
</body>
</html>
